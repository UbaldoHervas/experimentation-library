[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experimentpy"
version = "0.1.0"
description = "Statistical tools for online experimentation: sample size and sample ratio mismatch."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ubaldo Hervas"}]
keywords = ["ab-testing", "experimentation", "sample-size", "srm", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["scipy>=1.10"]

[project.urls]
Repository = "https://github.com/UbaldoHervas/experimentation-library"
Issues = "https://github.com/UbaldoHervas/experimentation-library/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
experimentpy = ["py.typed"]
